openapi: "3.0.3"
info:
  title: "ktor-notes API"
  description: >
    Notes REST API. Reads are synchronous; creates and updates are
    accepted asynchronously and processed via RabbitMQ, returning a
    commandId that identifies the queued operation.
  version: "1.0.0"
servers:
  - url: "http://localhost:8080"
tags:
  - name: notes
    description: Operations on notes
paths:
  /notes:
    get:
      tags: [ notes ]
      summary: List all notes
      operationId: listNotes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteResponse"
    post:
      tags: [ notes ]
      summary: Submit a note creation command
      description: >
        Publishes a create command to RabbitMQ and returns immediately.
        The note is not guaranteed to exist yet when this call returns;
        poll GET /notes to observe it once the worker processes the
        command.
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "202":
          description: Accepted — command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCommand"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notes/{id}:
    get:
      tags: [ notes ]
      summary: Get a note by id
      operationId: getNote
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          description: Invalid note id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [ notes ]
      summary: Submit a note update command
      description: >
        Publishes an update command to RabbitMQ and returns immediately.
        `version` must match the note's current version (optimistic
        concurrency); a stale version results in the command being
        rejected asynchronously by the worker.
      operationId: updateNote
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "202":
          description: Accepted — command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCommand"
        "400":
          description: Invalid note id, invalid request body, or nothing to update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [ notes ]
      summary: Delete a note
      operationId: deleteNote
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid note id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: Note id
      schema:
        type: integer
        format: int64
  schemas:
    NoteResponse:
      type: object
      required: [ id, title, content, version ]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        version:
          type: integer
          format: int64
      example:
        id: 1
        title: "Groceries"
        content: "Milk, eggs, bread"
        version: 0
    CreateNoteRequest:
      type: object
      required: [ title, content ]
      properties:
        title:
          type: string
        content:
          type: string
      example:
        title: "Groceries"
        content: "Milk, eggs, bread"
    UpdateNoteRequest:
      type: object
      required: [ version ]
      description: At least one of `title` or `content` must be provided.
      properties:
        version:
          type: integer
          format: int64
          description: The note's current version, for optimistic concurrency.
        title:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
      example:
        version: 0
        title: "Groceries (updated)"
    AcceptedCommand:
      type: object
      required: [ commandId ]
      properties:
        commandId:
          type: string
          format: uuid
      example:
        commandId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          type: string
      example:
        error: "Note not found"
